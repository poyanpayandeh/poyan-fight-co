<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>poyan-fight-co | Glove Builder</title>
  </head>
  <body>
    <div class="app">
      <div class="stage">
        <canvas class="webgl"></canvas>
      </div>
 
      <aside class="panel">
        <div class="panel-body">
          <p class="brand">Poyan Fight Co</p>
          <h1>Build your gloves</h1>
          <div id="options"></div>
        </div>
 
        <footer class="panel-foot">
          <div>
            <span class="price-label">Total (NZD)</span>
            <strong class="price" id="price" aria-live="polite"></strong>
          </div>
          <button class="cart" id="add-to-cart" type="button">Add to cart</button>
        </footer>
      </aside>
    </div>
 
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
